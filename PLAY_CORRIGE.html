<title>PLAY</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--u:1vh;--bg:#070b22;--bg2:#0d1544;--cy:#4be8ff;--cy2:#1b9cc4;--w:#fff;--gold:#ffd23f;--pk:#ff5fa2;--dim:#7d8ac4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:'Press Start 2P',monospace;color:var(--w);image-rendering:pixelated;font-size:calc(var(--u)*2.6)}
canvas,.px{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.layer{position:absolute;inset:0}
.hidden{display:none!important}


/* ---------- Profil ---------- */
#auth{z-index:70;background:radial-gradient(ellipse at 50% 40%,#14297a,#070b22 70%);display:flex;align-items:center;justify-content:center;overflow:auto}
#auth .abox{width:min(88vh*1.1,86vw);max-height:96vh;overflow:auto;background:#0d1544;border:calc(var(--u)*.7) solid var(--cy);box-shadow:0 0 0 calc(var(--u)*.7) #070b22,0 calc(var(--u)*1.4) 0 calc(var(--u)*.7) #0a3a5a;padding:calc(var(--u)*3) calc(var(--u)*4);display:flex;flex-direction:column;gap:calc(var(--u)*1.8);text-align:center}
#auth .at{font-size:calc(var(--u)*6);color:var(--cy);text-shadow:0 calc(var(--u)*.6) 0 var(--cy2)}
#auth .as{font-size:calc(var(--u)*2.4);color:var(--gold)}
#auth label{display:flex;flex-direction:column;gap:calc(var(--u)*.9);text-align:left;font-size:calc(var(--u)*1.8);color:var(--dim)}
#auth input{font:inherit;font-size:calc(var(--u)*2.4);color:var(--w);background:#070b22;border:calc(var(--u)*.5) solid var(--cy2);padding:calc(var(--u)*1.3);outline:0;border-radius:0;user-select:text;-webkit-user-select:text}
#auth input:focus{border-color:var(--gold)}
#auth button{font-size:calc(var(--u)*2.2);padding:calc(var(--u)*1.5);background:#14297a;border:calc(var(--u)*.5) solid var(--cy)}
#auth #aok{background:#6366f1;border-color:#fff}
#auth #aimp{background:none;border-color:transparent;color:var(--cy2);font-size:calc(var(--u)*1.7)}
#auth #aswitch{background:none;border-color:transparent;color:var(--dim);font-size:calc(var(--u)*1.7)}
#aerr{min-height:calc(var(--u)*2.4);font-size:calc(var(--u)*1.7);color:var(--pk);line-height:1.5}

/* ---------- Écran portrait bloquant ---------- */
#rot{display:none;position:fixed;inset:0;z-index:99999;background:#070b22;flex-direction:column;align-items:center;justify-content:center;gap:5vmin;text-align:center;padding:6vmin;pointer-events:none}
@media (orientation:portrait){#rot{display:flex}}
#rot canvas{width:34vmin;height:34vmin;animation:turn 2s steps(6) infinite}
@keyframes turn{0%,25%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot p{font-size:4.4vmin;line-height:1.7;color:var(--cy)}
#rot small{font-size:3vmin;color:var(--dim);line-height:1.7}

/* ---------- Boot / Intro ---------- */
#boot{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6);z-index:50;cursor:pointer}
#boot .ttl{font-size:calc(var(--u)*12);color:var(--cy);text-shadow:0 calc(var(--u)*1) 0 var(--cy2),0 calc(var(--u)*2) 0 #0a3a5a}
#boot .blink{font-size:calc(var(--u)*3);animation:bl 1s steps(2) infinite;color:var(--w)}
@keyframes bl{50%{opacity:0}}
#intro{z-index:40;background:#000}
#intro canvas{width:100%;height:100%;display:block}
#skip{position:absolute;right:2vw;bottom:2vh;font-size:calc(var(--u)*2);color:var(--dim)}

/* ---------- Accueil ---------- */
#home{z-index:10}
#bgc{width:100%;height:100%;display:block}
#top{position:absolute;left:0;right:0;top:0;height:calc(var(--u)*11);display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:linear-gradient(#050818e8,#050818a0 70%,#05081800)}
#top .logo{font-size:calc(var(--u)*4.4);color:var(--cy);text-shadow:calc(var(--u)*.5) calc(var(--u)*.5) 0 #0a3a5a;letter-spacing:2px}
#top .mid{text-align:center;line-height:1.7}
#clock{font-size:calc(var(--u)*4.2)}
#date{font-size:calc(var(--u)*2);color:var(--dim);text-transform:uppercase}
#top .r{display:flex;align-items:center;gap:calc(var(--u)*2.2)}
#top canvas{width:calc(var(--u)*6);height:calc(var(--u)*6)}
#av{box-shadow:0 0 0 calc(var(--u)*.5) var(--cy)}
.ico{width:calc(var(--u)*6);height:calc(var(--u)*6)}
#pname{font-size:calc(var(--u)*2)}

/* carrousel */
#stage{position:absolute;left:0;right:0;top:calc(var(--u)*12);height:calc(var(--u)*52)}
.cv{position:absolute;left:50%;top:50%;transition:transform .28s cubic-bezier(.2,.9,.3,1),opacity .28s,filter .28s;will-change:transform}
.cv canvas{display:block;width:100%;height:100%;box-shadow:0 0 0 calc(var(--u)*.6) #000,0 0 0 calc(var(--u)*1.2) #2a3a80,calc(var(--u)*1.6) calc(var(--u)*1.6) 0 calc(var(--u)*1.2) #000a}
.cv.sel canvas{box-shadow:0 0 0 calc(var(--u)*.6) #000,0 0 0 calc(var(--u)*1.2) var(--cy),0 0 calc(var(--u)*5) calc(var(--u)*1) #4be8ff88}
.cv.off{filter:brightness(.55) saturate(.8)}
.cur{position:absolute;pointer-events:none;left:50%;top:50%;z-index:5}
.cur i{position:absolute;width:calc(var(--u)*3);height:calc(var(--u)*3);border:calc(var(--u)*.9) solid var(--gold)}
.cur i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.cur i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.cur i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.cur i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.cur{animation:breath .8s steps(2) infinite}
@keyframes breath{50%{margin:calc(var(--u)*-.8) 0 0 calc(var(--u)*-.8);padding:calc(var(--u)*.8)}}
.arrow{position:absolute;top:50%;width:calc(var(--u)*7);height:calc(var(--u)*7);transform:translateY(-50%);opacity:.8;z-index:6}
.arrow.l{left:1.2vw}.arrow.r{right:1.2vw}
.arrow canvas{width:100%;height:100%}

#info{position:absolute;left:0;right:0;top:calc(var(--u)*65);text-align:center;line-height:1.8}
#gname{font-size:calc(var(--u)*4.4);color:var(--w);text-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 #000}
#gtag{font-size:calc(var(--u)*2.2);color:var(--cy);margin-top:calc(var(--u)*1)}
#gstat{font-size:calc(var(--u)*1.9);color:var(--dim);margin-top:calc(var(--u)*1.2)}
#hintp{font-size:calc(var(--u)*1.9);color:var(--gold);margin-top:calc(var(--u)*1.4);animation:bl 1.2s steps(2) infinite}
#dots{position:absolute;left:0;right:0;top:calc(var(--u)*63.5);display:flex;justify-content:center;gap:calc(var(--u)*1.2)}
#dots b{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);background:#2a3a80}
#dots b.on{background:var(--cy);box-shadow:0 0 0 calc(var(--u)*.4) #fff}

/* onglets */
#tabs{position:absolute;left:0;right:0;bottom:calc(var(--u)*3.5);display:flex;justify-content:center;gap:calc(var(--u)*3)}
.tab{padding:calc(var(--u)*1.8) calc(var(--u)*3.6);font-size:calc(var(--u)*2.4);background:#101a52;color:var(--dim);box-shadow:0 calc(var(--u)*-.6) 0 0 #243688,0 calc(var(--u)*.6) 0 0 #243688,calc(var(--u)*-.6) 0 0 0 #243688,calc(var(--u)*.6) 0 0 0 #243688,calc(var(--u)*1) calc(var(--u)*1.2) 0 0 #000a;display:flex;align-items:center;gap:calc(var(--u)*1.4)}
.tab canvas{width:calc(var(--u)*3);height:calc(var(--u)*3)}
.tab.on{background:#18337a;color:var(--w);box-shadow:0 calc(var(--u)*-.6) 0 0 var(--cy),0 calc(var(--u)*.6) 0 0 var(--cy),calc(var(--u)*-.6) 0 0 0 var(--cy),calc(var(--u)*.6) 0 0 0 var(--cy),calc(var(--u)*1) calc(var(--u)*1.2) 0 0 #000a}
.tab.foc{animation:tf .6s steps(2) infinite}
@keyframes tf{50%{transform:translateY(calc(var(--u)*-.8))}}

/* panneaux paramètres / trophées */
.panel{position:absolute;left:8vw;right:8vw;top:calc(var(--u)*13);bottom:calc(var(--u)*14);background:#0a1240e6;box-shadow:0 0 0 calc(var(--u)*.7) var(--cy2),0 0 0 calc(var(--u)*1.4) #000,calc(var(--u)*1.6) calc(var(--u)*1.6) 0 calc(var(--u)*1.4) #000a;padding:calc(var(--u)*2.4);overflow:hidden;display:flex;flex-direction:column}
.panel h2{font-size:calc(var(--u)*3);color:var(--gold);margin-bottom:calc(var(--u)*2);text-shadow:calc(var(--u)*.5) calc(var(--u)*.5) 0 #000;display:flex;justify-content:space-between;align-items:center}
.panel h2 span{font-size:calc(var(--u)*2.2);color:var(--cy)}
.list{flex:1;overflow-y:auto;scrollbar-width:none;touch-action:pan-y}
.list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--u)*1.8) calc(var(--u)*2);margin-bottom:calc(var(--u)*1.2);background:#101a52;font-size:calc(var(--u)*2.3);box-shadow:inset 0 0 0 calc(var(--u)*.4) #243688}
.row.foc{background:#18337a;box-shadow:inset 0 0 0 calc(var(--u)*.6) var(--gold)}
.row .v{color:var(--cy)}
.bar{display:inline-flex;gap:calc(var(--u)*.5);vertical-align:middle}
.bar b{width:calc(var(--u)*1.3);height:calc(var(--u)*2.4);background:#243688}
.bar b.on{background:var(--cy)}
.grp{font-size:calc(var(--u)*2.2);color:var(--pk);margin:calc(var(--u)*1.6) 0 calc(var(--u)*1.2)}
.tr{display:flex;align-items:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1.3) calc(var(--u)*2);margin-bottom:calc(var(--u)*1);background:#101a52;box-shadow:inset 0 0 0 calc(var(--u)*.4) #243688}
.tr canvas{width:calc(var(--u)*5);height:calc(var(--u)*5);flex:none}
.tr .t{font-size:calc(var(--u)*2.1);line-height:1.7}
.tr .t small{display:block;font-size:calc(var(--u)*1.7);color:var(--dim)}
.tr.lock{opacity:.5}
.tr.lock canvas{filter:grayscale(1) brightness(.6)}
#back{position:absolute;left:2vw;top:calc(var(--u)*12.5);z-index:12;display:flex;align-items:center;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*2.2);color:var(--cy)}
#back canvas{width:calc(var(--u)*4);height:calc(var(--u)*4)}

/* toast trophée */
#toast{position:absolute;left:50%;top:calc(var(--u)*13);transform:translate(-50%,-300%);z-index:60;background:#0a1240;padding:calc(var(--u)*1.8) calc(var(--u)*3);display:flex;gap:calc(var(--u)*2);align-items:center;box-shadow:0 0 0 calc(var(--u)*.7) var(--gold),0 0 0 calc(var(--u)*1.4) #000;transition:transform .4s steps(6)}
#toast.show{transform:translate(-50%,0)}
#toast canvas{width:calc(var(--u)*5);height:calc(var(--u)*5)}
#toast div{font-size:calc(var(--u)*2);line-height:1.8}
#toast small{display:block;color:var(--gold);font-size:calc(var(--u)*1.7)}

/* splash jeu */
#splash{z-index:70;background:#000;display:flex;align-items:center;justify-content:center;gap:5vw;opacity:0;pointer-events:none;transition:opacity .25s steps(4)}
#splash.show{opacity:1;pointer-events:auto}
#splash canvas{height:60vh;aspect-ratio:3/4;box-shadow:0 0 0 calc(var(--u)*1) var(--cy),0 0 0 calc(var(--u)*2) #000,0 0 calc(var(--u)*8) calc(var(--u)*2) #4be8ff66;animation:pop .6s steps(5)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#splash .sx{display:flex;flex-direction:column;gap:calc(var(--u)*3);max-width:44vw}
#splash .sn{font-size:calc(var(--u)*5);line-height:1.5;color:var(--w);text-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 #000}
#splash .st{font-size:calc(var(--u)*2.2);color:var(--cy);line-height:1.8}
#splash .ld{width:calc(var(--u)*36);height:calc(var(--u)*2.6);background:#101a52;box-shadow:0 0 0 calc(var(--u)*.5) var(--cy2)}
#splash .ld i{display:block;height:100%;width:0;background:var(--cy)}
#splash .lt{font-size:calc(var(--u)*1.9);color:var(--dim)}

/* jeu */
#game{z-index:30;background:#000}
#game iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#pbtn{position:absolute;left:4px;top:4px;z-index:5;width:calc(var(--u)*6);min-width:30px;aspect-ratio:1;opacity:.45;background:#070b22cc;box-shadow:0 0 0 2px var(--cy)}
#pbtn:active,#pbtn:hover{opacity:1}
#pbtn canvas{width:100%;height:100%;display:block}
#pause{position:absolute;inset:0;z-index:8;background:#030615dd;display:flex;align-items:center;justify-content:center}
#pause .box{background:#0a1240;padding:calc(var(--u)*4) calc(var(--u)*6);display:flex;flex-direction:column;gap:calc(var(--u)*2);min-width:calc(var(--u)*50);box-shadow:0 0 0 calc(var(--u)*.8) var(--cy),0 0 0 calc(var(--u)*1.6) #000}
#pause h3{text-align:center;font-size:calc(var(--u)*4);color:var(--gold);margin-bottom:calc(var(--u)*1.4)}
#pause .row{justify-content:center;margin:0;font-size:calc(var(--u)*2.6)}
#pause .pg{text-align:center;font-size:calc(var(--u)*1.7);color:var(--dim);margin-top:calc(var(--u)*1)}
</style>
</head>
<body>
<div id="app">

<div id="boot" class="layer" onclick="if(typeof startFromBoot==='function')startFromBoot();else document.querySelector('#boot .blink').textContent='ERREUR JAVASCRIPT — RECHARGE LA PAGE'">
  <div class="ttl">PLAY</div>
  <div class="blink">APPUIE POUR ALLUMER</div>
</div>

<div id="auth" class="layer hidden"><div class="abox">
  <div class="at">PLAY</div><div class="as" id="atitle">CONNEXION</div>
  <label>PSEUDO<input id="apseudo" maxlength="12" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
  <label>MOT DE PASSE<input id="apass" type="password" maxlength="32" autocomplete="current-password"></label>
  <label id="aconf" class="hidden">CONFIRMER LE MOT DE PASSE<input id="apass2" type="password" maxlength="32" autocomplete="new-password"></label>
  <div id="aerr"></div>
  <button id="aok">SE CONNECTER</button>
  <button id="aswitch">CRÉER UN PROFIL</button>
  <button id="aimp">IMPORTER UN PROFIL (AUTRE APPAREIL)</button>
</div></div>

<div id="intro" class="layer hidden"><canvas id="ic" width="192" height="108"></canvas><div id="skip">CLIC = PASSER</div></div>

<div id="home" class="layer hidden">
  <canvas id="bgc" width="160" height="90"></canvas>
  <div id="top">

function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);return'rgb('+A.map((v,i)=>v+(B[i]-v)*t|0).join(',')+')'}

function txtp(g,s,cx,y,col){s=String(s).toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const w=s.length*4-1;let x=Math.round(cx-w/2);
 for(const ch of s){const gl=FNT[ch];if(gl)for(let k=0;k<15;k++)if(gl[k]==='1'){g.fillStyle=col;g.fillRect(x+k%3,y+((k/3)|0),1,1)}x+=4}}

let AC=null,MG=null,musG=null;
function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination);musG=AC.createGain();musG.gain.value=0;musG.connect(MG);applyVol()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function applyVol(){if(MG)MG.gain.value=S.mute?0:S.vol/10}
function beep(f,d=.06,ty='square',v=.08,f2,delay=0,dest){if(!AC||S.mute)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+d+.02)}
const sNav=()=>{if(S.sfx){beep(880,.04,'square',.05);}},sOk=()=>{if(S.sfx){beep(660,.07,'square',.07);beep(990,.1,'square',.07,0,.07)}},sBack=()=>{if(S.sfx)beep(440,.08,'square',.06,300)},sTro=()=>{[784,988,1175,1568].forEach((f,i)=>beep(f,.18,'triangle',.1,0,i*.1))};
function startupSound(){if(!AC||S.mute)return;const t=AC.currentTime;
 [55,82.4,110].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2,t+2.6);const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(200,t);fl.frequency.exponentialRampToValueAtTime(2400,t+2.6);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.09,t+2.4);g.gain.exponentialRampToValueAtTime(.0005,t+4.6);o.connect(fl);fl.connect(g);g.connect(MG);o.start(t);o.stop(t+4.7)});
 for(let i=0;i<14;i++)beep(1200+i*180,.12,'sine',.03,0,.8+i*.12);
 [523,659,784,1047,1568].forEach((f,i)=>{beep(f,1.8,'sine',.09,0,2.9+i*.02);beep(f*2,1.2,'triangle',.03,0,2.9)});beep(65,1.4,'sine',.3,40,2.9)}
let musOn=false,musTimer=null,musStep=0,musNext=0;
const CH=[[57,60,64,69],[53,57,60,65],[48,52,55,60],[55,59,62,67]];
function musSched(){if(!AC)return;while(musNext<AC.currentTime+.6){const ch=CH[(musStep>>3)%4],n=ch[[0,1,2,3,2,1,2,3][musStep%8]%4],f=440*Math.pow(2,(n-69)/12);
  if(musStep%8===0){beep(f/2,1.6,'sine',.12,0,musNext-AC.currentTime,musG);beep(f/4,1.6,'triangle',.1,0,musNext-AC.currentTime,musG)}
  beep(f,.5,'triangle',.07,0,musNext-AC.currentTime,musG);musNext+=.34;musStep++}}
function musicOn(){audio();if(!AC)return;if(!musOn){musOn=true;musNext=AC.currentTime+.1;musTimer=setInterval(musSched,200)}musG.gain.cancelScheduledValues(0);musG.gain.setTargetAtTime(.5,AC.currentTime,.4)}
function musicOff(){if(!AC)return;musG.gain.setTargetAtTime(0,AC.currentTime,.15);setTimeout(()=>{if(musG.gain.value<.02){clearInterval(musTimer);musOn=false}},900)}

   g.fillStyle=k<1?(k>.6?'#bff6ff':'#4be8ff'):(t>3.2?'#fff':'#d8fbff');

  if(t>3.4){g.fillStyle='#4be8ff';const tt='CONSOLE VIRTUELLE';g.globalAlpha=Math.min(1,(t-3.4)*1.2);txtp(g,tt,W/2,Y0+44,'#9bb0ff');g.globalAlpha=1}

const PATCH='<script>(function(){var P=parent.PLAY,w=window,o=w.requestAnimationFrame.bind(w),q=[];w.requestAnimationFrame=function(cb){return o(function(t){if(P.paused){q.push(cb);return}cb(t)})};P.flush=function(){var a=q;q=[];a.forEach(function(cb){o(cb)})};addEventListener("keydown",function(e){if(e.key==="Escape"){e.preventDefault();e.stopImmediatePropagation();P.togglePause()}},true);})();<\/script>';
async function launch(i){if(state!=='home')return;state='splash';cur=GAMES[i];audio();sOk();musicOff();tryFS();
 const sp=$('#splash');cover($('#spc'),cur.id);$('#spn').textContent=cur.name;$('#spt').textContent=cur.tag;$('#spl').style.width='0';sp.classList.add('show');
 const load=Promise.resolve().then(()=>dec(cur.id)).catch(()=>null);
 const t0=performance.now();const bar=setInterval(()=>{$('#spl').style.width=Math.min(100,(performance.now()-t0)/22)+'%'},100);
 beep(523,.12,'triangle',.1);beep(784,.2,'triangle',.1,0,.12);

function mountGame(){$('#game iframe')?.remove();paused=false;PLAY.paused=false;PLAY.flush=null;

function nav(k){if(state==='auth')return;
 if(state==='boot'){if(k==='ok')startFromBoot();return}
 if(state==='intro'){endIntro();return}
 if(state==='pause'){if(k==='up'){pIdx=(pIdx+2)%3;pRender();sNav()}else if(k==='down'){pIdx=(pIdx+1)%3;pRender();sNav()}else if(k==='ok')pAct($$('#pause .row')[pIdx].dataset.a);else if(k==='back'||k==='pause')closePause();return}
 if(state==='game'){if(k==='pause')openPause();return}
 if(state!=='home')return;audio();
 const tabs=['games','settings','trophies'];
 if(focus==='tabs'){
  if(k==='left'){setViewIdx(-1)}else if(k==='right'){setViewIdx(1)}else if(k==='down'||k==='ok'){focus='content';sNav();render()}return}

 if(gp){const b=gp.buttons,st={left:b[14]?.pressed||gp.axes[0]<-.6,right:b[15]?.pressed||gp.axes[0]>.6,up:b[12]?.pressed||gp.axes[1]<-.6,down:b[13]?.pressed||gp.axes[1]>.6,ok:b[0]?.pressed,back:b[1]?.pressed,pause:b[9]?.pressed};

 requestAnimationFrame(pad)}
